<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Automation Tool</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Toolbar ── -->
  <header id="toolbar">
    <div id="address-bar">
      <span class="bar-icon">🌐</span>
      <input id="url-input" type="text" placeholder="https://example.com 입력 후 Enter 또는 이동 클릭" autocomplete="off" spellcheck="false" />
      <button id="go-btn" class="btn btn-go">이동</button>
    </div>

    <div id="controls">
      <button id="record-btn" class="btn btn-record" disabled>
        <span class="dot"></span> 녹화
      </button>
      <div class="speed-wrap">
        <label class="speed-label" for="speed-select">속도</label>
        <select id="speed-select" class="speed-select">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>
      <button id="replay-btn" class="btn btn-replay" disabled>
        ▶ 재생
      </button>
    </div>
  </header>

  <!-- ── Status bar ── -->
  <div id="statusbar"><span id="status-text">서버에 연결 중…</span></div>

  <!-- ── Main layout ── -->
  <div id="main">

    <!-- Canvas browser area -->
    <div id="browser-wrap">
      <div id="browser-chrome">
        <span id="frame-url">about:blank</span>
        <span id="rec-badge" class="hidden">● REC</span>
      </div>
      <canvas id="browser-canvas" tabindex="0"></canvas>
    </div>

    <!-- Recording panel -->
    <aside id="rec-panel">
      <div id="rec-panel-header">
        <h2>녹화 목록</h2>
        <span id="rec-count">0개</span>
      </div>
      <div id="rec-list">
        <p class="empty-msg">아직 녹화가 없습니다.</p>
      </div>
    </aside>

  </div>

  <!-- ── Replay progress overlay ── -->
  <div id="replay-overlay">
    <div class="ov-box">
      <div class="ov-title">▶ 재생 중</div>
      <div class="ov-name" id="ov-name"></div>
      <div class="ov-bar-wrap"><div class="ov-bar-fill" id="ov-bar"></div></div>
      <div class="ov-progress" id="ov-progress">준비 중…</div>
      <button class="ov-cancel" id="ov-cancel">취소</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
