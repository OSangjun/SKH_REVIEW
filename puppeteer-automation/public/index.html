<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Automation Tool</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Toolbar ── -->
  <header id="toolbar">
    <div id="address-bar">
      <span class="bar-icon">🌐</span>
      <input id="url-input" type="text" placeholder="https://example.com 입력 후 Enter 또는 이동 클릭" autocomplete="off" spellcheck="false" />
      <button id="go-btn" class="btn btn-go">이동</button>
    </div>

    <div id="controls">
      <button id="cookie-btn" class="btn btn-cookie" title="쿠키 설정">🍪 쿠키</button>
      <button id="record-btn" class="btn btn-record" disabled>
        <span class="dot"></span> 기록
      </button>
      <div class="speed-wrap">
        <label class="speed-label" for="speed-select">속도</label>
        <select id="speed-select" class="speed-select">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </div>
      <button id="replay-btn" class="btn btn-replay" disabled>
        ▶ 재생
      </button>
      <label id="http-compare-wrap" title="OFF 시 HTTP 상태코드(2xx)만 확인하고 응답 바디 비교를 건너뜁니다">
        <input type="checkbox" id="http-compare-chk" checked />
        <span>응답비교</span>
      </label>
      <label id="mock-replay-wrap" title="ON 시 녹화된 응답을 반환하여 실서버 없이 테스트합니다">
        <input type="checkbox" id="mock-replay-chk" />
        <span>목 응답</span>
      </label>
    </div>
  </header>

  <!-- ── Status bar ── -->
  <div id="statusbar"><span id="status-text">서버에 연결 중…</span></div>

  <!-- ── Main layout ── -->
  <div id="main">

    <!-- Canvas browser area -->
    <div id="browser-wrap">
      <div id="browser-chrome">
        <span id="frame-url">about:blank</span>
        <span id="rec-badge" class="hidden">● REC</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="browser-canvas" tabindex="0"></canvas>
        <div id="result-badge" class="result-badge hidden"></div>
      </div>
    </div>

    <!-- Recording panel -->
    <aside id="rec-panel">
      <div id="rec-panel-header">
        <h2>테스트 케이스 목록</h2>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="rec-count">0개</span>
          <button id="suite-btn" class="btn btn-suite" disabled title="선택한 테스트 케이스를 순서대로 일괄 실행">⚡ 스위트</button>
        </div>
      </div>
      <div id="rec-list">
        <p class="empty-msg">아직 테스트 케이스가 없습니다.</p>
      </div>
    </aside>

  </div>

  <!-- ── Replay progress overlay ── -->
  <div id="replay-overlay">
    <div class="ov-box">
      <div class="ov-title" id="ov-title">▶ 재생 중</div>
      <div class="ov-suite-info hidden" id="ov-suite-info"></div>
      <div class="ov-name" id="ov-name"></div>
      <div class="ov-bar-wrap"><div class="ov-bar-fill" id="ov-bar"></div></div>
      <div class="ov-progress" id="ov-progress">준비 중…</div>
      <div class="ov-suite-result hidden" id="ov-suite-result"></div>
      <button class="ov-cancel" id="ov-cancel">취소</button>
    </div>
  </div>

  <!-- ── Log panel ── -->
  <div id="log-panel">
    <div id="log-header">
      <span id="log-toggle-btn" class="log-toggle" title="접기/펼치기">▼</span>
      <span class="log-title">터미널</span>
      <span id="log-badge" class="log-badge"></span>
      <button id="log-clear-btn" class="log-clear" title="로그 지우기">지우기</button>
    </div>
    <div id="log-body">
      <div id="log-lines"></div>
    </div>
  </div>

  <!-- ── Cookie settings modal ── -->
  <div id="cookie-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🍪 쿠키 설정</h3>
        <button id="cookie-modal-close" class="modal-close">✕</button>
      </div>
      <p class="modal-desc">이동 전에 브라우저에 주입할 쿠키를 입력하세요. <code>domain</code>을 비워두면 현재 URL의 도메인이 사용됩니다.</p>
      <div class="cookie-table-wrap">
        <table id="cookie-table">
          <thead>
            <tr>
              <th>name</th>
              <th>value</th>
              <th>domain</th>
              <th>path</th>
              <th>secure</th>
              <th>httpOnly</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cookie-tbody"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button id="cookie-add-row" class="btn btn-add-row">+ 행 추가</button>
        <div style="display:flex;gap:8px">
          <button id="cookie-clear" class="btn btn-clear-cookie">전체 삭제</button>
          <button id="cookie-apply" class="btn btn-apply-cookie">적용</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── HTTP 응답 편집 모달 ── -->
  <div id="resp-modal" class="modal-overlay hidden">
    <div class="modal-box resp-modal-box">
      <div class="modal-header">
        <h3 id="resp-modal-title">HTTP 응답 목록</h3>
        <button id="resp-modal-close" class="modal-close">✕</button>
      </div>
      <div class="resp-modal-body">
        <div id="resp-list" class="resp-list"></div>
      </div>
      <div class="modal-footer">
        <span id="resp-count-label" class="resp-count-label"></span>
        <div style="display:flex;gap:8px">
          <button id="resp-add-btn" class="btn btn-add-row">+ 항목 추가</button>
          <button id="resp-save-btn" class="btn btn-apply-cookie">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
